<div class="modal-header bg-light">
    <h3 class="modal-title fw-bold text-gray-800">Búsqueda de Usuarios</h3>
    <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="activeModal.dismiss()">
        <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i>
    </div>
</div>

<div class="modal-body">
    <div class="border p-5 mb-5 bg-light-secondary rounded">
        <div class="row gy-3 align-items-center">
            <div class="col-md-2 fw-bold text-uppercase fs-8">BUSCAR PERSONA:</div>
            
            <div class="col-md-8">
                <div class="row g-2 mb-2">
                    <label class="col-sm-3 col-form-label fs-7 fw-bold text-end">Tipo de Usuario:</label>
                    <div class="col-sm-9">
                        <select class="form-select form-select-sm form-select-solid">
                            <option>Servidor Público</option>
                            <option>Ciudadano</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <label class="col-sm-3 col-form-label fs-7 fw-bold text-end">Datos Usuario:</label>
                    
                    <div class="col-sm-9 position-relative"> 
                        <input 
                            type="text" 
                            [(ngModel)]="filtro_usuario" 
                            class="form-control form-control-sm form-control-solid" 
                            placeholder="cédula, nombre, cargo, correo, institución, área"
                            (keyup.enter)="buscarUsuarios()"
                            (input)="usuarios_encontrados = []">
                
                        <div class="list-group position-absolute w-100 shadow-lg" 
                             *ngIf="usuarios_encontrados.length > 0" 
                             style="z-index: 1100; top: 100%; max-height: 200px; overflow-y: auto;">
                            
                            <button type="button" 
                                *ngFor="let user of usuarios_encontrados"
                                class="list-group-item list-group-item-action py-2 px-3"
                                (click)="agregarALaTabla(user)">
                                <div class="d-flex flex-column">
                                    <span class="fs-7 fw-bold text-gray-800">{{ user.nombre_completo }}</span>
                                    <span class="fs-9 text-muted">{{ user.n_document }} | {{ user.empresa }}</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-2 text-center">
                <button 
                    type="button" 
                    (click)="buscarUsuarios()"
                    [disabled]="cargando"
                    class="btn btn-warning btn-sm fw-bold w-100 shadow-sm text-white" 
                    style="background-color: #f6a032;">
                    
                    <span *ngIf="!cargando">
                        <i class="fa fa-search me-1"></i> Buscar
                    </span>
                    
                    <div *ngIf="cargando" class="d-flex align-items-center justify-content-center">
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        <span>Buscando...</span>
                    </div>
                </button>
            </div>
        </div>
    </div>
    <div class="separator separator-dashed my-5"></div>
    <div class="text-center mb-3">
        <span class="badge badge-secondary fw-bold text-uppercase p-3 w-100 fs-7 border border-secondary" style="color: #333;">Personas en la Lista</span>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-sm align-middle fs-8 gs-3">
            <thead>
                <tr class="bg-light-primary text-gray-800 fw-bold border-bottom-2">
                    <th>Tipo</th>
                    <th>Nombres</th>
                    <th>Institución</th>
                    <th>Área / Sección</th>
                    <th>E-mail</th>
                    <th class="text-center">Uso</th>
                    <th class="text-center">Colocar como</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="personas_en_lista.length === 0">
                    <td colspan="6" class="text-center text-muted py-5">
                        No hay personas seleccionadas en la lista.
                    </td>
                </tr>
    
                <tr *ngFor="let p of personas_en_lista; let i = index">
                    <td>
                        <span class="badge badge-light-dark fs-9 text-uppercase">Serv.</span>
                    </td>
                    <td class="fw-bold text-gray-800">
                        {{ p.nombre_completo }}
                    </td>
                    <td>{{ p.empresa }}</td>
                    <td>
                        <div class="d-flex flex-column">
                            <span class="fw-bold">{{ p.proyecto }}</span>
                            <span class="text-muted fs-9">{{ p.subseccion }}</span>
                        </div>
                    </td>
                    <td>{{ p.email }}</td>
                    <td class="text-center">
                        <div class="d-flex flex-column align-items-center">
                            <i class="fa fa-key fs-4" 
                               [ngClass]="p.tiene_firma ? 'text-success' : 'text-gray-400'"
                               [title]="p.tiene_firma ? 'Tiene Firma Electrónica' : 'No tiene firma'">
                            </i>
                            <span class="fs-10 fw-bold" [ngClass]="p.tiene_firma ? 'text-success' : 'text-gray-500'">
                                FIRMA
                            </span>
                        </div>
                    </td>
                    <td class="text-center">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            
                            <select 
                            [(ngModel)]="p.rol_envio" 
                            class="form-select form-select-sm fs-9 py-1 px-2 w-100px shadow-sm"
                            [ngClass]="{'border-danger': !p.rol_envio}"
                            [disabled]="p.lockedRole === true">
                            <option [ngValue]="undefined" disabled>Seleccione...</option>
                            <option value="PARA">Para</option>
                            <option value="DE">De</option>
                            <option value="COPIA">Copia</option>
                        </select>
                    
                            <button 
                                type="button"
                                (click)="personas_en_lista.splice(i, 1)" 
                                class="btn btn-sm btn-icon btn-light-danger w-25px h-25px"
                                title="Quitar de la lista"
                                *ngIf="p.lockedRole !== true">
                                <i class="fa fa-trash fs-9"></i>
                            </button>
                    
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
        <button 
            type="button" 
            class="btn btn-light-danger btn-sm fw-bold me-2" 
            (click)="limpiarLista()">
            Limpiar Todo
        </button>
    
        <button 
            type="button" 
            class="btn btn-primary btn-sm fw-bold shadow-sm"
            [disabled]="personas_en_lista.length === 0 || cargando"
            (click)="enviarSeleccion()">
            <i class="fa fa-check-circle me-1"></i> Asignar Usuarios
        </button>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-light-danger btn-sm" (click)="activeModal.dismiss()">Cerrar</button>
</div>
