<div class="modal-content">
    <div class="modal-header">
      <h2 class="fw-bolder">Editar Tipo Documento: {{ TIPODOCUMENTO_SELECTED?.id_tipodocumento }}</h2>
      <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="cerrar()">
        <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i>
      </div>
    </div>
  
    <div class="modal-body scroll-y mx-5 my-7">
      <form class="form">
        <div class="card p-5">
          <div class="fv-row mb-4">
            <label class="required fw-bold fs-6 mb-2">Nombre de Tipo Documento:</label>
            <input
              type="text"
              name="nombre"
              class="form-control form-control-solid"
              [(ngModel)]="nombre"
            />
          </div>
  
          <div class="fv-row mb-4">
            <label class="required fw-bold fs-6 mb-2">Urgencia Predeterminada:</label>
            <select 
              name="prioridad" 
              class="form-select form-select-solid" 
              [(ngModel)]="prioridadId">
              <option value="normal">Normal</option>
              <option value="urgente">Urgente</option>
              <option value="especial">Especial</option>
            </select>
          </div>
        </div>
        <div class="fv-row mb-4">
            <label class="required fw-bold fs-6 mb-2">Estado:</label>
            <select 
                name="estado" 
                class="form-select form-select-solid" 
                [(ngModel)]="estado">
                <option value="1">Activo</option>
                <option value="2">Inactivo</option>
            </select>
        </div>
  
        <div class="text-center pt-10">
          <button type="button" class="btn btn-light me-3" (click)="cerrar()">Cerrar</button>
          <button
            type="button"
            class="btn btn-primary"
            (click)="update()"
            [disabled]="isLoading || !nombre"
          >
            <span class="indicator-label">Guardar Cambios</span>
            <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
