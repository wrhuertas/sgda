<div class="modal-content">
  <!-- HEADER -->
  <div class="modal-header">
    <h2 class="fw-bolder">Eliminar Área</h2>
    <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="cerrar()">
      <span class="svg-icon svg-icon-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
          <rect opacity="0.5" x="6" y="17.3" width="16" height="2" rx="1" transform="rotate(-45 6 17.3)" fill="currentColor"/>
          <rect x="7.4" y="6" width="16" height="2" rx="1" transform="rotate(45 7.4 6)" fill="currentColor"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- BODY -->
  <div class="modal-body scroll-y mx-5 my-7">
    <p>¿Estás seguro que deseas desactivar el área <strong>{{ AREA_SELECTED?.nombre }}</strong>?</p>

    <div class="text-center pt-5">
      <button type="button" class="btn btn-light me-3" (click)="cerrar()">Cancelar</button>
      <button type="button" class="btn btn-danger" (click)="confirmDelete()" [disabled]="isLoading">
        <span>Desactivar</span>
        <span class="spinner-border spinner-border-sm ms-2" *ngIf="isLoading"></span>
      </button>
    </div>
  </div>
</div>
