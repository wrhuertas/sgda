<div class="modal-header">
  <h2 class="fw-bold">Eliminar Super Usuario</h2>
  <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="modal.dismiss()">
    <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i>
  </div>
</div>

<div class="modal-body text-center py-8">
  <i class="ki-duotone ki-trash fs-3x text-danger mb-4">
    <span class="path1"></span><span class="path2"></span><span class="path3"></span>
    <span class="path4"></span><span class="path5"></span>
  </i>
  <p class="fs-5 mb-2">
    ¿Está seguro de eliminar al Super Usuario
    <strong>{{ SUPER_USUARIO_SELECTED?.full_name || SUPER_USUARIO_SELECTED?.name }}</strong>?
  </p>
  <p class="text-muted fs-7 mb-0">Esta acción no se puede deshacer.</p>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="modal.dismiss()" [disabled]="eliminando">Cancelar</button>
  <button type="button" class="btn btn-danger" (click)="eliminar()" [disabled]="eliminando">
    {{ eliminando ? 'Eliminando...' : 'Eliminar' }}
  </button>
</div>
