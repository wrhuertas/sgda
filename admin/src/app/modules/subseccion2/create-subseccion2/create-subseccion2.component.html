<!--begin::Modal content CREATE SubSección1-->
<div class="modal-content">
  <!--begin::Modal header-->
  <div class="modal-header">
    <h2 class="fw-bolder">Crear Sub Sección 2</h2>
    <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="cerrar()">
      <span class="svg-icon svg-icon-1">
        <!-- Ícono de cerrar -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
          <rect opacity="0.5" x="6" y="17.3" width="16" height="2" rx="1" transform="rotate(-45 6 17.3)" fill="currentColor"/>
          <rect x="7.4" y="6" width="16" height="2" rx="1" transform="rotate(45 7.4 6)" fill="currentColor"/>
        </svg>
      </span>
    </div>
  </div>
  <!--end::Modal header-->

  <!--begin::Modal body-->
  <div class="modal-body scroll-y mx-5 my-7">
    <form class="form">
      <div class="card p-5">
        <!-- Mostrar nombre de la SubSección padre -->
        <div class="fv-row mb-4">
          <label class="fw-bold fs-6 mb-2">Sub Sección 1 Padre:</label>
          <input
            type="text"
            class="form-control form-control-solid"
            [value]="nombreSubseccion"
            disabled
          />
        </div>

        <!-- Input para nombre de la nueva SubSección1 -->
        <div class="fv-row mb-4">
          <label class="required fw-bold fs-6 mb-2">Nombre de la Sub Sección 2:</label>
          <input
            type="text"
            name="nombreSubSeccion1"
            class="form-control form-control-solid"
            placeholder="Ej. Documentos Internos"
            [(ngModel)]="nombre"
          />
          <!-- Input oculto para id de la SubSección padre -->
          <input type="hidden" name="idSubseccion" [value]="idSubseccion" />
        </div>
      </div>

      <!-- Botones -->
      <div class="text-center pt-10">
        <button type="button" class="btn btn-light me-3" (click)="cerrar()">Cerrar</button>
        <button type="button" class="btn btn-primary" (click)="guardar()">
          <span class="indicator-label">Registrar</span>
          <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading"></span>
        </button>
      </div>
    </form>
  </div>
  <!--end::Modal body-->
</div>
<!--end::Modal content CREATE SubSección1-->
