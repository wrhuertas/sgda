<div class="modal-header">
  <h5 class="modal-title">Visualizar Documento como Imagen</h5>
  <button type="button" class="close" aria-label="Close" (click)="cerrarModal()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body p-3" style="background-color: #aaa9a9;">
  <!-- Barra de botones -->
  <div class="mb-3 d-flex gap-2 justify-content-center">
    <button type="button" class="btn btn-secondary btn-sm" (click)="zoom()">🔍 Zoom</button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="limpiar()">🧹 Limpiar</button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="recortar()">✂️ Recortar</button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="girar()">🔄 Girar</button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="activarFirma()">✍️ Firmar</button>
  </div>

  <div *ngIf="imagenesPDF.length === 0" class="text-center my-5 text-muted">
    <p>Cargando imágenes del PDF...</p>
  </div>

  <!-- Imágenes -->
  <div *ngFor="let img of imagenesPDF; let i = index" class="mb-3 d-flex justify-content-center">
    <div #imagenContenedor style="background-color: white; padding: 10px; display: inline-block; border-radius: 4px; position: relative;">
      
      <img
        [src]="img"
        [style.max-width.px]="maxWidth"
        [style.max-height.px]="maxHeight"
        class="img-fluid"
        (mousedown)="startSelection($event, imagenContenedor)"
        (mousemove)="moveSelection($event, imagenContenedor)"
        (mouseup)="endSelection($event)"
        (mouseleave)="endSelection($event)"
        (click)="colocarFirma($event, i)"
        style="user-select: none; -webkit-user-drag: none;"
      />

      <!-- Cuadro de selección azul -->
      <div *ngIf="seleccionActiva && paginaSeleccionada === i"
           [style.left.px]="seleccionX"
           [style.top.px]="seleccionY"
           [style.width.px]="seleccionWidth"
           [style.height.px]="seleccionHeight"
           style="position: absolute; border: 2px dashed #007bff; pointer-events: none;">
      </div>

      <!-- Cuadro de firma verde -->
      <div *ngIf="!firmaActiva && paginaFirma === i"
           [style.left.px]="firmaX"
           [style.top.px]="firmaY"
           [style.width.px]="firmaWidth"
           [style.height.px]="firmaHeight"
           style="position: absolute; border: 2px solid green; pointer-events: none;">
      </div>

    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cerrarModal()">Cerrar</button>
</div>
