<form
  class="form w-100"
  novalidate="novalidate"
  [formGroup]="forgotPasswordForm"
  (ngSubmit)="submit()"
  id="kt_login_password_reset_form"
>
  <!--begin::Heading-->
  <div class="text-center mb-10">
    <h1 class="text-gray-900 fw-bolder mb-3">
      ¿Olvidaste tu contraseña?
    </h1>

    <div class="text-gray-500 fw-semibold fs-6">
      Ingresa tu correo electrónico para restablecer tu contraseña.
    </div>
  </div>
  <!--end::Heading-->

  <!-- Alert error -->
  <ng-container *ngIf="errorState === errorStates.HasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        Lo sentimos, se detectaron algunos errores. Por favor, inténtalo nuevamente.
      </div>
    </div>
  </ng-container>

  <!-- Alert success -->
  <ng-container *ngIf="errorState === errorStates.NoError">
    <div class="mb-10 bg-light-info p-8 rounded">
      <div class="text-info">
        Se ha enviado el enlace para restablecer la contraseña. Revisa tu correo.
      </div>
    </div>
  </ng-container>

  <!-- Email -->
  <div class="fv-row mb-8">
    <label class="form-label fw-bolder text-gray-900 fs-6">
      Correo electrónico
    </label>

    <input
      class="form-control bg-transparent"
      type="email"
      formControlName="email"
      placeholder="Correo electrónico"
      name="email"
      autocomplete="off"
      [ngClass]="{
        'is-invalid': forgotPasswordForm.controls['email'].invalid,
        'is-valid': forgotPasswordForm.controls['email'].valid
      }"
    />

    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'El correo electrónico es obligatorio',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'email',
        message: 'El correo electrónico no es válido',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'minLength',
        message: 'El correo debe tener al menos 3 caracteres',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'maxLength',
        message: 'El correo no debe superar los 360 caracteres',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>
  </div>

  <!-- Buttons -->
  <div class="d-flex flex-wrap justify-content-center pb-lg-0">
    <button
      type="submit"
      id="kt_password_reset_submit"
      class="btn btn-primary me-4"
    >
      <span class="indicator-label">Enviar</span>

      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress">
          Por favor espera...
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
    </button>

    <a
      routerLink="/auth/login"
      id="kt_login_password_reset_form_cancel_button"
      class="btn btn-light"
    >
      Cancelar
    </a>
  </div>
</form>

<!-- Template errores -->
<ng-template
  #formError
  let-control="control"
  let-message="message"
  let-validation="validation"
>
  <ng-container
    *ngIf="control.hasError(validation) && (control.dirty || control.touched)"
  >
    <div class="fv-plugins-message-container">
      <div class="fv-help-block">
        <span role="alert">{{ message }}</span>
      </div>
    </div>
  </ng-container>
</ng-template>
