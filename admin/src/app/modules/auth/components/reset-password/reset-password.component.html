<form [formGroup]="resetForm" (ngSubmit)="submit()" class="form w-100">

  <!-- Título -->
  <div class="text-center mb-10">
    <h1 class="fw-bolder">Restablecer contraseña</h1>
    <p class="text-muted">Ingresa tu nueva contraseña</p>
  </div>

  <!-- Mensaje de error general -->
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Mensaje de éxito -->
  <div *ngIf="success" class="alert alert-success">
    Contraseña actualizada correctamente. Redirigiendo...
  </div>

  <!-- Password -->
  <div class="mb-5">
    <input
      type="password"
      class="form-control"
      placeholder="Nueva contraseña"
      formControlName="password"
    />
    <div *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid" class="text-danger mt-1">
      <div *ngIf="resetForm.get('password')?.errors?.['required']">La contraseña es requerida</div>
      <div *ngIf="resetForm.get('password')?.errors?.['minlength']">
        La contraseña debe tener al menos 8 caracteres
      </div>
    </div>
  </div>

  <!-- Confirm Password -->
  <div class="mb-5">
    <input
      type="password"
      class="form-control"
      placeholder="Confirmar contraseña"
      formControlName="password_confirmation"
    />
    <div *ngIf="resetForm.get('password_confirmation')?.touched && resetForm.get('password_confirmation')?.invalid" class="text-danger mt-1">
      <div *ngIf="resetForm.get('password_confirmation')?.errors?.['required']">Confirma tu contraseña</div>
    </div>

    <!-- Validación global: contraseñas no coinciden -->
    <div *ngIf="resetForm.errors?.['notMatch'] && resetForm.get('password_confirmation')?.touched" class="text-danger mt-1">
      Las contraseñas no coinciden
    </div>
  </div>

  <!-- Botón de envío -->
  <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Guardando...' : 'Cambiar contraseña' }}
  </button>
</form>
