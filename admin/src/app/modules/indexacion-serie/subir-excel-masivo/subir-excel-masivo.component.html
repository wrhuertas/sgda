<div class="modal-header bg-primary text-white">
    <h5 class="modal-title"><i class="fas fa-file-excel me-2"></i> Carga Masiva</h5>
    <button type="button" class="btn-close btn-close-white" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <div class="p-5 border border-2 border-dashed rounded bg-light">
                <input type="file" id="fileInput" class="d-none" (change)="onFileChange($event)" accept=".xlsx, .xls">
                
                <label for="fileInput" class="w-100 mb-0" style="cursor: pointer;">
                    <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                    
                    <div *ngIf="!selectedFile">
                        <h4 class="text-dark">Haga clic para seleccionar el archivo</h4>
                        <p class="text-muted">Formatos: .xlsx, .xls</p>
                    </div>

                    <div *ngIf="selectedFile" class="mt-3 p-3 bg-dark text-white rounded">
                        ¡ARCHIVO DETECTADO!: {{ selectedFile.name }}
                        <p class="text-primary mt-2">Haga clic aquí si desea cambiar el archivo</p>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <div class="row" *ngIf="previewData.length > 0">
        <div class="col-12">
            <div class="table-responsive border rounded" style="max-height: 200px;">
                <table class="table table-sm table-striped mb-0">
                    <thead class="table-dark">
                        <tr><th *ngFor="let h of objectKeys(previewData[0])">{{h}}</th></tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let row of previewData.slice(0, 5)">
                            <td *ngFor="let h of objectKeys(row)">{{row[h]}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4" *ngIf="isUploading">
        <div class="progress" style="height: 25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                 [style.width.%]="progress">{{progress}}%</div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
    <button type="button" class="btn btn-success" [disabled]="!selectedFile || isUploading" (click)="procesarArchivo()">
        Iniciar Carga
    </button>
</div>
