<div class="modal-header">
  <h5 class="modal-title fw-bold">
    <i class="fas fa-code-branch me-2 text-primary"></i>
    Versiones del documento
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cerrar()"></button>
</div>

<div class="modal-body">
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="fw-bold text-muted">
        <tr>
          <th>#</th>
          <th>Nombre del Documento</th>
          <th>Fecha de Subida</th>
          <th>Usuario Registro</th>
          <th>Estado</th>
          <th class="text-center">Ver</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="cargando">
          <td colspan="6" class="text-center text-muted py-4">Cargando versiones...</td>
        </tr>
        <tr *ngFor="let v of versiones; let i = index">
          <td>{{ i + 1 }}</td>
          <td>
            <i class="fas fa-file-earmark-pdf-fill text-danger me-2"></i>
            {{ v.nombre }}
          </td>
          <td><small>{{ v.fecha | date:'yyyy-MM-dd HH:mm' }}</small></td>
          <td>{{ v.usuario || '-' }}</td>
          <td>
            <span class="badge" [ngClass]="v.estado == 1 ? 'badge-light-success' : 'badge-light-primary'">
              {{ v.estado == 1 ? 'Actual' : 'Versión antigua' }}
            </span>
          </td>
          <td class="text-center">
            <button type="button" class="btn btn-sm btn-light-primary" (click)="verVersion(v)" title="Ver documento">
              <i class="fas fa-eye"></i> Ver
            </button>
          </td>
        </tr>
        <tr *ngIf="!cargando && versiones.length === 0">
          <td colspan="6" class="text-center text-muted py-4">No se encontraron versiones.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="cerrar()">Cerrar</button>
</div>
