<!--begin::Modal content-->
<div class="modal-content">
  <!--begin::Modal header-->
  <div class="modal-header" id="kt_modal_add_user_header">
    <h5 class="modal-title">
      Agregar Documento para la Sección Documental — 
      <span style="color: blue;">{{ nombreProyecto }}</span>
    </h5>
    

    <div class="btn btn-sm btn-icon btn-active-color-primary" (click)="close()" style="cursor:pointer">
      <i class="fas fa-times"></i>
    </div>
  </div>
  <!--end::Modal header-->

  <!--begin::Modal body-->
  <div class="modal-body py-10 px-lg-17">
    <form class="form">
      
      <!-- TABS -->
      <ul ngbNav #nav="ngbNav" class="nav nav-tabs mb-3">
        <li [ngbNavItem]="1">
          <a ngbNavLink>Subir un documento</a>
          <ng-template ngbNavContent>
            <!-- ✅ Aquí va TODO tu contenido actual -->
            <div class="row g-5">
              <!-- Columna 1 -->
              <div class="col-md-4">
                <div class="mb-3">
                  <button type="button" class="btn btn-sm btn-secondary" (click)="agregarCampo()">Agregar Parámetros</button>
                </div>
                <div *ngFor="let campo of campos; let i = index" class="mb-2 d-flex align-items-center gap-2">
                  <input type="text" class="form-control" [(ngModel)]="campo.titulo" [name]="'titulo_' + i"
                         placeholder="Ej: Nombre, Apellido, Título" style="width: 40%;" />
                  <input type="text" class="form-control" [(ngModel)]="campo.valor" [name]="'valor_' + i"
                         [readonly]="inputSeleccionadoIndex !== i" (click)="seleccionarInput(i)"
                         placeholder="Ingrese valor o seleccione del PDF" style="width: 50%;" />
                  <button type="button" class="btn btn-icon btn-sm btn-danger" (click)="eliminarCampo(i)">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </div>
              </div>

              <!-- Columna 2 -->
              <div class="col-md-8">
                <div class="fv-row mb-5">
                  <label class="form-label">Subir documentos (solo PDF)</label>
                  <input type="file" class="form-control" (change)="onFileSelectedtemp($event)" accept=".pdf" />
                </div>

                <div class="mb-3 d-flex gap-2">
                  <button type="button" class="btn btn-primary" (click)="hacerOCR()">
                    <i class="fas fa-file-pdf me-2"></i> Subir PDF
                  </button>
                 

                  <!-- 🔹 Botón para abrir el texto OCR -->
                  <!-- Botón para mostrar el texto OCR -->
                  <button
                    class="btn btn-primary mt-3"
                    (click)="mostrarOCR()"
                    [disabled]="!textoOCR"
                  >
                    Ver texto OCR
                  </button>

                  <!-- Contenedor oculto inicialmente -->
                  <div *ngIf="mostrarTextoOCR" class="mt-3">
                    <h4>Texto reconocido (OCR):</h4>
                    <textarea
                      [value]="textoOCR"
                      rows="10"
                      style="width:100%; font-family: monospace;"
                      readonly
                    ></textarea>
                  </div>

                </div>

                <div class="mt-3" *ngIf="imagenesPDF.length > 0">
                  <h5>Visor de páginas del PDF</h5>
                  <div class="mb-3" style="display: flex; gap: 10px;">
                    <button class="btn btn-warning" (click)="activarRecorte()">
                      {{ recorteActivo ? 'Desactivar recorte' : 'Activar recorte' }}
                    </button>
                    <button class="btn btn-info" (click)="activarZoom()">
                      {{ zoomActivo ? 'Desactivar Zoom' : 'Hacer Zoom' }}
                    </button>
                  </div>

                  <div *ngIf="zoomActivo" style="margin-bottom: 10px;">
                    <button (click)="zoomIn()">+</button>
                    <button (click)="zoomOut()">-</button>
                  </div>

                  <div *ngFor="let img of imagenesPDF; let i = index" style="margin-bottom: 1rem;">
                    <p>Página {{ i + 1 }}</p>
                    <canvas #pdfCanvasTemp [attr.width]="maxWidth" [attr.height]="maxHeight"
                            [style.cursor]="recorteActivo ? 'crosshair' : 'grab'"
                            style="border:1px solid #ccc;"
                            (mousedown)="recorteActivo ? onMouseDown($event, i) : startDrag($event, i)"
                            (mousemove)="recorteActivo ? onMouseMove($event, i) : dragImage($event, i)"
                            (mouseup)="recorteActivo ? onMouseUp($event, i) : stopDrag()"
                            (mouseleave)="stopDrag()"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </ng-template>
        </li>

        <li [ngbNavItem]="2">
          <a ngbNavLink>Subir varios documentos</a>
          <ng-template ngbNavContent>
            <!-- ✅ Contenido del segundo tab -->
            <div class="fv-row mb-5">
              <label class="form-label">Seleccionar varios PDFs</label>
              <input type="file" class="form-control" 
              (change)="onMultipleFilesSelected($event)" 
              accept=".pdf,.zip" multiple />

            </div>
            <button type="button" class="btn btn-success" (click)="subirVariosPDFs()">
              <i class="fas fa-file-pdf me-2"></i> Subir varios documentos
            </button>
          </ng-template>
        </li>
      </ul>

      <!-- Renderiza el contenido del tab activo -->
      <div [ngbNavOutlet]="nav"></div>

      <!-- Botones finales -->
      <div class="text-end pt-10">
        <button type="button" class="btn btn-light me-3" (click)="close()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardar()">
          <span class="indicator-label">Guardar</span>
        </button>
      </div>
    </form>
  </div>
  <!--end::Modal body-->
</div>
<!--end::Modal content-->
