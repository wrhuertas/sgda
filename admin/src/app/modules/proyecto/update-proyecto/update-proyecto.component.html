<!--begin::Modal content UPDATE Proyecto-->
<div class="modal-content">
  <!--begin::Modal header-->
  <div class="modal-header" id="kt_modal_update_proyecto_header">
    <h2 class="fw-bolder">Actualizar Proyecto</h2>
    <div class="btn btn-icon btn-sm btn-active-icon-primary" (click)="modal.dismiss()">
      <span class="svg-icon svg-icon-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
          <rect opacity="0.5" x="6" y="17.3" width="16" height="2" rx="1" transform="rotate(-45 6 17.3)" fill="currentColor" />
          <rect x="7.4" y="6" width="16" height="2" rx="1" transform="rotate(45 7.4 6)" fill="currentColor" />
        </svg>
      </span>
    </div>
  </div>
  <!--end::Modal header-->

  <!--begin::Modal body-->
  <div class="modal-body scroll-y mx-5 my-7">
    <form id="kt_modal_update_proyecto_form" class="form" action="#">
      <div class="card p-5">
        <div class="fv-row mb-4">
          <label class="required fw-bold fs-6 mb-2">Nombre del Proyecto:</label>
          <input
            type="text"
            name="nombre"
            class="form-control form-control-solid"
            placeholder="Ej. Sistema de ventas"
            [(ngModel)]="nombre"
            required
          />
        </div>

        <div class="fv-row mb-4">
          <label class="fw-bold fs-6 mb-2">Siglas</label>
          <input
            type="text"
            name="siglas"
            class="form-control form-control-solid"
            placeholder="Ej. SDV"
            [(ngModel)]="siglas"
            (input)="siglas = (siglas || '').toUpperCase()"
          />
        </div>

                <!-- ESTADO -->
                <div class="row g-9 mb-8">
                  <div class="col-md-6 fv-row">
                    <label class="required fw-bold fs-6 mb-2">Estado:</label>
                    <select [(ngModel)]="estado" [ngModelOptions]="{standalone: true}" class="form-select form-select-solid">
                      <option [value]="1">Activo</option>
                      <option [value]="0">Inactivo</option>
                    </select>
                  </div>
                </div>
        <!-- Puedes agregar aquí más campos si necesitas, como id_empresa o estado -->
      </div>

      <!-- Botones -->
      <div class="text-center pt-10">
        <button type="button" class="btn btn-light me-3" (click)="modal.dismiss()">Cerrar</button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="update()"
          [disabled]="!nombre.trim()"
        >
          <span class="indicator-label">Actualizar</span>
          <span
            class="spinner-border spinner-border-sm align-middle ms-2"
            *ngIf="isLoading"
          ></span>
        </button>
      </div>
    </form>
  </div>
  <!--end::Modal body-->
</div>
<!--end::Modal content UPDATE Proyecto-->
